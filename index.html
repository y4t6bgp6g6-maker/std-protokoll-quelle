<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yetizettel">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f0e9">
<meta name="color-scheme" content="light dark">
<script>
  // Darstellung sofort setzen (sonst blitzt beim Start die falsche Farbe auf); app.js übernimmt danach
  try {
    var t = (JSON.parse(localStorage.getItem('yetizettel.settings.v1') || '{}').theme) || 'auto';
    if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
<title>Yetizettel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>
<div class="edge-fade top"></div>
<div class="edge-fade bottom"></div>
<div id="modal-layer"></div>
<div id="toast" role="status"></div>
<script src="pdf.js"></script>
<script src="holidays.js"></script>
<script src="import.js"></script>
<script src="lohn.js"></script>
<script src="payslip.js"></script>
<script src="app.js"></script>
</body>
</html>
